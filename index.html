<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Veljano — Приложение</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #FFFFFF; color: #212121;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none;
  }
  #screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .hidden { display: none !important; }

  /* Стартовый экран */
  #start h1 {
    font-size: 42px; font-weight: 800; margin-bottom: 8px;
    color: #212121; text-align: center;
  }
  #start p { color: #888; margin-bottom: 40px; text-align: center; }
  #playBtn {
    background: #4CAF50; color: white; border: none;
    padding: 22px 60px; font-size: 26px; font-weight: 700;
    border-radius: 18px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(76,175,80,0.4);
    transition: transform 0.1s;
  }
  #playBtn:active { transform: scale(0.95); }

  /* Игра */
  #game { position: relative; padding: 0; }
  #hud {
    position: absolute; top: 10px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 20px; font-size: 18px; font-weight: 700;
    color: #212121; z-index: 2;
  }
  #score { color: #4CAF50; }
  #backBtn {
    position: absolute; top: 10px; right: 20px;
    background: #eee; border: none; border-radius: 10px;
    padding: 8px 14px; font-size: 16px; cursor: pointer;
    color: #333; z-index: 3;
  }
  canvas {
    display: block; background: #FAFAFA;
    border-radius: 12px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }
  #wordPopup {
    position: absolute;
    background: #4CAF50; color: white;
    padding: 8px 16px; border-radius: 10px;
    font-size: 18px; font-weight: 700;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    transform: translate(-50%, -100%) scale(0.8);
    white-space: nowrap;
    z-index: 10;
    box-shadow: 0 4px 12px rgba(76,175,80,0.4);
  }
  #wordPopup.show {
    opacity: 1;
    transform: translate(-50%, -100%) scale(1);
  }
  #gameOver {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.95);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 12px; z-index: 5;
  }
  #gameOver h2 { font-size: 32px; margin-bottom: 10px; color: #E53935; }
  #gameOver p { font-size: 20px; margin-bottom: 25px; color: #555; }
  #restartBtn {
    background: #4CAF50; color: white; border: none;
    padding: 14px 40px; font-size: 20px; font-weight: 700;
    border-radius: 14px; cursor: pointer;
  }
  #controls {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
    z-index: 4;
  }
  .ctrl {
    width: 60px; height: 60px; border-radius: 50%;
    background: #eee; border: none; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #333;
  }
  .ctrl:active { background: #ddd; }
</style>
</head>
<body>

<!-- Стартовый экран -->
<div id="screen" class="hidden">
  <div id="start">
    <h1>🐍 Змейка</h1>
    <p>Veljano Edition</p>
    <button id="playBtn">Играть</button>
  </div>

  <!-- Игра -->
  <div id="game" class="hidden" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
    <div id="hud">
      <div>Очки: <span id="score">0</span></div>
    </div>
    <button id="backBtn">← Меню</button>
    <canvas id="canvas"></canvas>
    <div id="wordPopup"></div>
    <div id="gameOver" class="hidden">
      <h2>Игра окончена</h2>
      <p>Очки: <span id="finalScore">0</span></p>
      <button id="restartBtn">Ещё раз</button>
    </div>
    <div id="controls">
      <button class="ctrl" data-dir="left">←</button>
      <button class="ctrl" data-dir="up">↑</button>
      <button class="ctrl" data-dir="down">↓</button>
      <button class="ctrl" data-dir="right">→</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  СЛОВАРЬ ВЭЛЬЯНСКИХ СЛОВ (случайные для показа)
// ============================================================
const VELJANO_WORDS = [
  "Vejl", "Ajo", "Lui", "Fjat", "Djomo", "Kajto", "Kajta",
  "Jundo", "Wajsa", "Lïbro", "Jesso", "Brodo", "Mlako",
  "Kojfï", "Cijaj", "Äwlojanto", "Taxï", "Lajdwï", "Vïzzwï",
  "Dajwo", "Two", "Kjanwo", "Vajzwï", "Plyklwï", "Sonwï",
  "Djenkwï", "Djomwo", "Fïlwo", "Föŝtejwï", "Gwo", "Wo",
  "Wïllwï", "Nadwï", "Pälwï", "Pjekwï", "Stojwo", "Tajtwa",
  "Arbajtwï", "Bëżwï", "Blümwo", "Brawo", "Cajnwo", "Ciötwï",
  "Kulliwo", "Lecojwï", "Lejnwï", "Lïmwo", "Marwo", "Nożwo",
  "Sejtwï", "Helidwo", "Ojwï", "Jesswo", "Kalikwo", "Kapwo",
  "Kjamwo", "Kïllwo", "Lïtwo", "Malliwï", "Navïnwo", "Pajwï",
  "Pälülwï", "Plaswo", "Praplyklwï", "Sohwï", "Mïnwo",
  "Ròdwò", "Rwò", "Ïjwo", "Ïmgwo", "Ïnsgwo", "Vokaliwï",
  "Velomenwï", "Wajswo", "Woikwo", "Żyhavïnwo", "Havo",
  "Majo", "Nożo", "Raĵo", "Rasa", "Ŝujla", "Djomàto",
  "Buso", "Cug", "Mëtro", "Tajzo", "Zalato", "Züipo",
  "Banano", "Arva", "Ara", "Ŝomo", "Fja", "Bjata",
  "Buba", "Amo", "Noŝi", "Tajsa", "Salo", "Kojko",
  "Ümo", "Vordto", "Gramatïkje", "Lekswï", "Cajte", "Zalogo"
];

// ============================================================
//  ИГРА ЗМЕЙКА
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const popup = document.getElementById('wordPopup');
const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('finalScore');
const gameOverDiv = document.getElementById('gameOver');

let CELL = 20;
let COLS = 20;
let ROWS = 20;
let snake, dir, nextDir, food, score, gameLoop, speed, popupTimer;

function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 40, 500);
  const maxH = window.innerHeight - 160;
  const size = Math.min(maxW, maxH);
  const cells = 20;
  CELL = Math.floor(size / cells);
  COLS = cells;
  ROWS = cells;
  canvas.width = CELL * COLS;
  canvas.height = CELL * ROWS;
}

function initGame() {
  resizeCanvas();
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 140;
  scoreEl.textContent = "0";
  gameOverDiv.classList.add('hidden');
  placeFood();
}

function placeFood() {
  while (true) {
    const f = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) {
      food = f;
      return;
    }
  }
}

function randomVeljanoWord() {
  return VELJANO_WORDS[Math.floor(Math.random() * VELJANO_WORDS.length)];
}

function showWordPopup(x, y, word) {
  // Позиционируем попап над яблоком
  const canvasRect = canvas.getBoundingClientRect();
  const gameRect = document.getElementById('game').getBoundingClientRect();
  const px = canvasRect.left - gameRect.left + (x + 0.5) * CELL;
  const py = canvasRect.top - gameRect.top + y * CELL;

  popup.style.left = px + 'px';
  popup.style.top = py + 'px';
  popup.textContent = word;
  popup.classList.add('show');

  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => {
    popup.classList.remove('show');
  }, 1500);
}

function draw() {
  // Фон
  ctx.fillStyle = '#FAFAFA';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Сетка (едва заметная)
  ctx.strokeStyle = '#F0F0F0';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // Яблоко
  ctx.fillStyle = '#E53935';
  ctx.beginPath();
  ctx.arc(
    (food.x + 0.5) * CELL,
    (food.y + 0.5) * CELL,
    CELL * 0.4, 0, Math.PI * 2
  );
  ctx.fill();

  // Змейка
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4CAF50' : '#81C784';
    ctx.beginPath();
    const r = i === 0 ? CELL * 0.45 : CELL * 0.4;
    ctx.arc(
      (s.x + 0.5) * CELL,
      (s.y + 0.5) * CELL,
      r, 0, Math.PI * 2
    );
    ctx.fill();
  });
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Столкновение со стеной
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver();
  }
  // Столкновение с собой
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  // Съел яблоко
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    showWordPopup(food.x, food.y, randomVeljanoWord());
    placeFood();
    // Ускорение
    if (speed > 70) speed -= 3;
    clearInterval(gameLoop);
    gameLoop = setInterval(step, speed);
  } else {
    snake.pop();
  }

  draw();
}

function gameOver() {
  clearInterval(gameLoop);
  finalScoreEl.textContent = score;
  gameOverDiv.classList.remove('hidden');
}

function startGame() {
  initGame();
  draw();
  clearInterval(gameLoop);
  gameLoop = setInterval(step, speed);
}

// ============================================================
//  УПРАВЛЕНИЕ
// ============================================================
function setDir(dx, dy) {
  // Нельзя разворачиваться на 180
  if (dir.x === -dx && dir.y === -dy) return;
  nextDir = {x: dx, y: dy};
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') setDir(0, -1);
  else if (e.key === 'ArrowDown') setDir(0, 1);
  else if (e.key === 'ArrowLeft') setDir(-1, 0);
  else if (e.key === 'ArrowRight') setDir(1, 0);
});

// Свайпы
let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 20) setDir(1, 0);
    else if (dx < -20) setDir(-1, 0);
  } else {
    if (dy > 20) setDir(0, 1);
    else if (dy < -20) setDir(0, -1);
  }
  touchStart = null;
}, {passive: true});

// Кнопки управления
document.querySelectorAll('.ctrl').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.dir;
    if (d === 'up') setDir(0, -1);
    else if (d === 'down') setDir(0, 1);
    else if (d === 'left') setDir(-1, 0);
    else if (d === 'right') setDir(1, 0);
  });
});

// ============================================================
//  ЭКРАНЫ
// ============================================================
const screen = document.getElementById('screen');
const startScreen = document.getElementById('start');
const gameScreen = document.getElementById('game');

document.getElementById('playBtn').addEventListener('click', () => {
  startScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  gameScreen.style.display = 'flex';
  startGame();
});

document.getElementById('backBtn').addEventListener('click', () => {
  clearInterval(gameLoop);
  gameScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});

document.getElementById('restartBtn').addEventListener('click', () => {
  startGame();
});

// Показ стартового экрана
screen.classList.remove('hidden');
</script>
</body>
</html>
